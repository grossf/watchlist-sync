<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watchlist Sync</title>
<link rel="icon" type="image/svg+xml" href="/static/icon.svg">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="logo" viewBox="12 12.5 40 40">
    <path d="M21 13h22a3 3 0 0 1 3 3v36l-14-8.5L18 52V16a3 3 0 0 1 3-3z" fill="#e6e7ea"/>
    <g transform="translate(-1.5 0.5)">
      <path d="M36.13 34.9A7.2 7.2 0 1 1 38.77 26.54" fill="none" stroke="#5b8def" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M42.9 25.04L40.89 32.37L34.64 28.04Z" fill="#5b8def" stroke="#5b8def" stroke-width="1.2" stroke-linejoin="round"/>
    </g>
  </symbol>
  <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M7 4h10a1 1 0 0 1 1 1v15l-6-4-6 4V5a1 1 0 0 1 1-1z"/></symbol>
  <symbol id="i-activity" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4.5 6h.01M4.5 12h.01M4.5 18h.01" stroke-width="2.6"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20h4L18.5 9.5a2.12 2.12 0 0 0-3-3L5 17v3zM13.5 7.5l3 3"/></symbol>
  <symbol id="i-sync" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.4-4.6L4 8M4 4v4h4M4 13a8 8 0 0 0 14.4 4.6L20 16M20 20v-4h-4"/></symbol>
  <symbol id="i-rotate" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-8-8c2.2 0 4.3.9 5.9 2.4L20 8.5M20 4v4.5h-4.5"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M5.5 7l1 13h11l1-13M9 7V4h6v3"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
  <symbol id="i-grip" viewBox="0 0 24 24"><path d="M9 6h.01M9 12h.01M9 18h.01M15 6h.01M15 12h.01M15 18h.01" stroke-width="2.8"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5h.01"/></symbol>
  <symbol id="i-ext" viewBox="0 0 24 24"><path d="M7 17L17 7M8 7h9v9"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-loader" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9"/></symbol>
  <symbol id="i-github" viewBox="0 0 24 24"><path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12.3 12.3 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"/></symbol>
</svg>

<div class="app">
  <header class="topbar">
    <a class="brand" href="#/watchlists"><svg class="logo" aria-hidden="true"><use href="#logo"/></svg>Watchlist Sync</a>
    <button class="ghost" id="menu" aria-label="Menu"><svg class="i"><use href="#i-menu"/></svg></button>
  </header>
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#/watchlists"><svg class="logo" aria-hidden="true"><use href="#logo"/></svg>Watchlist Sync</a>
    <nav class="nav" id="nav">
      <a href="#/watchlists" data-page="watchlists"><svg class="i"><use href="#i-bookmark"/></svg>Watchlists<span class="dot red hidden" id="dot-watchlists"></span></a>
      <a href="#/connections" data-page="connections"><svg class="i"><use href="#i-activity"/></svg>Connections<span class="dot red hidden" id="dot-connections"></span></a>
      <a href="#/logs" data-page="logs"><svg class="i"><use href="#i-list"/></svg>Logs</a>
      <a href="#/settings" data-page="settings"><svg class="i"><use href="#i-sliders"/></svg>Settings</a>
    </nav>
    <div class="foot">
      <div class="row" id="foot-state" style="gap:7px"><span class="dot"></span><span>Loading…</span></div>
      <div class="row" style="gap:6px">
        <a class="row" id="github" href="#" target="_blank" rel="noopener" style="gap:6px"><svg class="i sm"><use href="#i-github"/></svg>GitHub</a>
        <span class="dim" id="version"></span>
        <a href="#" id="logout" class="hidden" style="margin-left:auto">Log out</a>
      </div>
    </div>
  </aside>
  <main><div class="page" id="page"></div></main>
</div>
<div id="dialog"></div>
<div class="toast" id="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>
